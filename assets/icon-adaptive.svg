      <rect width="1024" height="1024" fill="black"/>
      <g transform="translate(512 512) scale(0.72) translate(-512 -509)">
        <path d="M512 248 C602 248 676 320 676 410 C676 502 562 602 512 676 C462 602 348 502 348 410 C348 320 422 248 512 248 Z" fill="white"/>
        <path d="M450 356 L574 356 L512 434 Z" fill="black"/>
        <rect x="505" y="430" width="14" height="48" fill="black"/>
        <rect x="474" y="476" width="76" height="15" rx="7" fill="black"/>
        <rect x="402" y="732" width="220" height="18" rx="9" fill="white"/>
        <rect x="388" y="712" width="26" height="58" rx="7" fill="white"/>
        <rect x="610" y="712" width="26" height="58" rx="7" fill="white"/>
        <rect x="358" y="724" width="20" height="36" rx="6" fill="white"/>
        <rect x="646" y="724" width="20" height="36" rx="6" fill="white"/>
      </g>
